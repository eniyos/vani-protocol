[workspace]
resolver = "2"
members = ["crates/vani-mcp", "crates/vani-api"]

[workspace.package]
edition = "2021"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
dotenvy = "0.15"
tracing = "0.1"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
bincode = "1.3"
solana-sdk = "3"
solana-program = "3"
solana-system-interface = { version = "2", features = ["bincode"] }

[profile.release]
lto = "thin"