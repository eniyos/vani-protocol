[package]
name = "vani-mcp"
version = "0.1.0"
edition = "2021"

[lib]
name = "vani_mcp"
path = "src/lib.rs"

[[bin]]
name = "vani-mcp"
path = "src/main.rs"

description = "Vani Protocol — vernacular (voice-first) Solana DeFi over MCP. Speak Hindi, Telugu, Tamil; execute on-chain."
license = "MIT"
repository = "https://github.com/eniyos/vani-protocol"
homepage = "https://github.com/eniyos/vani-protocol"
documentation = "https://github.com/eniyos/vani-protocol#readme"
readme = "../../README.md"
keywords = ["solana", "mcp", "voice", "defi", "hindi"]
categories = ["command-line-utilities", "api-bindings"]
authors = ["Vani Protocol Contributors"]
exclude = [".env", ".env.*", "scripts/"]

[dependencies]
rmcp = { version = "3.1.1", features = ["server", "macros", "schemars", "transport-io"] }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { workspace = true, features = ["multipart"] }
base64 = { workspace = true }
tokio = { workspace = true }
dotenvy = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
p256 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
bincode = { workspace = true }
solana-sdk = { workspace = true }
solana-program = { workspace = true }
solana-system-interface = { workspace = true }